{% extends "base.html" %}
{% block title %}Laporkan sumber air — AquaTrace{% endblock %}
{% block content %}
<section class="form-card">
  <p class="eyebrow">WARGA · SUMBER AIR</p><h1>Laporkan sumber</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="nama">Nama sumber</label><input id="nama" name="nama" required maxlength="160">
    <label for="tipe">Jenis</label><select id="tipe" name="tipe" required><option value="sumur">Sumur</option><option value="sungai">Sungai</option><option value="pdam">PDAM</option><option value="mata_air">Mata air</option></select>
    <label for="region_id">Wilayah</label><select id="region_id" name="region_id" required>{% for region in regions %}<option value="{{ region.id }}">{{ region.nama }} ({{ region.level }})</option>{% endfor %}</select>
    <label for="lat">Lintang</label><input id="lat" name="lat" type="number" step="any" min="-90" max="90" required>
    <label for="lng">Bujur</label><input id="lng" name="lng" type="number" step="any" min="-180" max="180" required>
    <button class="button button-dark" type="submit">Simpan sumber</button>
  </form>
</section>
{% endblock %}
