{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <section class="toast-region" aria-label="Notifikasi" aria-live="polite">
    {% for category, message in messages %}
    <p class="toast toast-{{ category }}" role="{% if category == 'error' %}alert{% else %}status{% endif %}">
      <span class="material-symbols-outlined" aria-hidden="true">{% if category == "error" %}error{% elif category == "success" %}check_circle{% else %}info{% endif %}</span>{{ message }}
    </p>
    {% endfor %}
  </section>
  {% endif %}
{% endwith %}
