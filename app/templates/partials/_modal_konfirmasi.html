<dialog class="confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-title">
  <form method="dialog">
    <p class="eyebrow">KONFIRMASI</p>
    <h2 id="confirm-title">Lanjutkan tindakan ini?</h2>
    <p id="confirm-message">Perubahan ini tidak dapat dibatalkan.</p>
    <div class="actions">
      <button class="button button-secondary" value="cancel">Batal</button>
      <button class="button button-danger" id="confirm-accept" value="confirm">Ya, lanjutkan</button>
    </div>
  </form>
</dialog>
