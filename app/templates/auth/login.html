{% extends "base.html" %}
{% block title %}Masuk — AquaTrace{% endblock %}
{% block content %}
<section class="form-card" aria-labelledby="page-title">
  <p class="eyebrow">AKUN AQUATRACE</p>
  <h1 id="page-title">Masuk</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">
    <label for="password">Kata sandi</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button button-dark button-wide" type="submit">Masuk</button>
  </form>
  <p class="form-footer">Belum punya akun? <a href="{{ url_for('auth.register') }}">Daftar sebagai warga</a></p>
</section>
{% endblock %}
