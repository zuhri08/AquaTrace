{% extends "base.html" %}
{% block title %}Daftar — AquaTrace{% endblock %}
{% block content %}
<section class="form-card" aria-labelledby="page-title">
  <p class="eyebrow">AKUN WARGA</p>
  <h1 id="page-title">Buat akun</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="nama">Nama</label>
    <input id="nama" name="nama" autocomplete="name" required maxlength="120">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required maxlength="255">
    <label for="password">Kata sandi</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <p class="help">Gunakan minimal 8 karakter.</p>
    <button class="button button-dark button-wide" type="submit">Daftar</button>
  </form>
  <p class="form-footer">Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk</a></p>
</section>
{% endblock %}
